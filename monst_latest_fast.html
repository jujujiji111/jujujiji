function unpack(t){const bin=atob(t.d),a=new Uint8Array(t.w*t.h);for(let i=0;i<a.length;i++)a[i]=(bin.charCodeAt(i>>3)>>(7-(i&7)))&1;return a}
function mkDetector(TP){
  const KINDS=[
    {k:0,key:'pyr',  cx:70, cy:67,  thr:0.78},
    {k:0,key:'pyr',  cx:70, cy:67,  thr:0.82, part:'top'},

    {k:0,key:'pyr',  cx:70, cy:67,  thr:0.93, part:'bot'}
  ];
  function dec(t){const b=atob(t.d),a=new Float32Array(t.w*t.h);for(let i=0;i<a.length;i++)a[i]=b.charCodeAt(i);return{w:t.w,h:t.h,a}}
  function octMask(w,h,c){const m=new Uint8Array(w*h);for(let y=0;y<h;y++)for(let x=0;x<w;x++){m[y*w+x]=(x+y>=c&&(w-1-x)+y>=c&&x+(h-1-y)>=c&&(w-1-x)+(h-1-y)>=c)?1:0}return m}
  const tpls=KINDS.map(K=>{
    const t=dec(TP[K.key]);let m;
    if(K.key==='pyr'){m=new Uint8Array(t.w*t.h);const H=t.h,W=t.w,P=K.part;
      for(let y=0;y<H;y++)for(let x=0;x<W;x++){let ok=1;
        if(P==='top')ok=y<H*.6;else if(P==='bot')ok=y>=H*.4;else if(P==='left')ok=x<W*.6;else if(P==='right')ok=x>=W*.4;
        else if(P==='tl')ok=y<H*.65&&x<W*.65;else if(P==='tr')ok=y<H*.65&&x>=W*.35;
        m[y*W+x]=ok?1:0}}
    else{m=octMask(t.w,t.h,11);if(K.key==='sword'){for(let y=8;y<=59;y++)for(let x=15;x<=73;x++)m[y*t.w+x]=0}}

  });
  function half(src,W,H){const w=W>>1,h=H>>1,o=new Float32Array(w*h);for(let y=0;y<h;y++)for(let x=0;x<w;x++){const i=(2*y)*W+2*x;o[y*w+x]=(src[i]+src[i+1]+src[i+W]+src[i+W+1])/4}return{a:o,w,h}}
  function tHalf(t){const w=t.w>>1,h=t.h>>1,a=new Float32Array(w*h),m=new Uint8Array(w*h);for(let y=0;y<h;y++)for(let x=0;x<w;x++){const i=2*y*t.w+2*x;a[y*w+x]=(t.a[i]+t.a[i+1]+t.a[i+t.w]+t.a[i+t.w+1])/4;m[y*w+x]=(t.m[i]+t.m[i+1]+t.m[i+t.w]+t.m[i+t.w+1])>=3?1:0}return{w,h,a,m,K:t.K}}
  function prep(t,W){ // 差分オフセット・ゼロ平均テンプレ
    const off=[],tv=[];let s=0,n=0;for(let y=0;y<t.h;y++)for(let x=0;x<t.w;x++)if(t.m[y*t.w+x]){off.push(y*W+x);tv.push(t.a[y*t.w+x]);s+=t.a[y*t.w+x];n++}

  function ncc(I,p,pos){let sI=0,sII=0,sIT=0;const o=p.off,tp=p.tp,n=p.n;for(let i=0;i<n;i++){const v=I[pos+o[i]];sI+=v;sII+=v*v;sIT+=v*tp[i]}const va=sII-sI*sI/n;if(va<n*25)return -1;return sIT/Math.sqrt(va*p.s2)}

function newW(){try{if(!WURL)WURL=URL.createObjectURL(new Blob([WKSRC+"\n;self.onmessage=e=>{const tk=e.data.tk;WK_ON(e.data,m=>{m.tk=tk;self.postMessage(m)})};"],{type:'text/javascript'}));const w=new Worker(WURL);POOL.push(w);return w}catch(_){return null}}
/* 重い照合はWeb Workerで並列に実行(使えない環境では本体で順番に実行) */
function runMain(msg,cb){setTimeout(()=>{try{WKM=WKM||new Function(WKSRC+';return WK_ON')();WKM(msg,m=>{m.tk=msg.tk;cb(m)})}catch(err){console.error(err)}},0)}
function runJob(w,msg,cb,tr){if(!w)return runMain(msg,cb);let done=false,tm=null;const fin=d=>{if(done)return;if(d.t==='put'){cb(d);return}done=true;clearTimeout(tm);cb(d)},fb=()=>{if(done)return;done=true;clearTimeout(tm);try{w.terminate()}catch(_){}runMain(msg,cb)};w.onmessage=e=>fin(e.data);w.onerror=fb;w.onmessageerror=fb;tm=setTimeout(fb,20000);try{w.postMessage(msg)}catch(_){fb()}}
function applyBest(best,y0){for(let k=0;k<4;k++)if(best[k]){const r=best[k];det[k]={sc:r.sc,x:Math.max(B.l,Math.min(B.r,r.x+OFF[k][0])),y:Math.max(B.t,Math.min(B.b,y0+r.y+OFF[k][1]))}}}
function dedupeDet(){for(let i=0;i<4;i++)for(let j=i+1;j<4;j++)if(det[i]&&det[j]&&Math.hypot(det[i].x-det[j].x,det[i].y-det[j].y)<40){if(det[i].sc>=det[j].sc)det[j]=null;else det[i]=null}}
async function detect(){const im=$('bg'),W=1206,Hh=Math.round(im.naturalHeight*W/im.naturalWidth),y0=430,y1=Math.min(1830,Hh),h=y1-y0,tk=++dtk;killPool();det=[null,null,null,null];dets=[];blkBusy=false;if(!(h>200))return upd();
const CH=1400,bh=1394,cv=document.createElement('canvas');cv.width=W;cv.height=CH;const cx=cv.getContext('2d',{willReadFrequently:true});cx.drawImage(im,0,-y0,W,Hh);$('status').textContent='検出中…';
const id=cx.getImageData(0,0,W,CH).data,off=5*W*4,yel=findYellow(id.subarray(off),W,bh),g8=new Uint8Array(W*bh);
for(let i=0,j=off;i<g8.length;i++,j+=4)g8[i]=(.299*id[j]+.587*id[j+1]+.114*id[j+2]+.5)|0;
blkBusy=true;const nb=Math.max(1,Math.min(3,(navigator.hardwareConcurrency||4)-1)),groups=Array.from({length:nb},()=>[]);for(let t=0;t<7;t++)groups[t%nb].push(t);
let parts=[],left=groups.length;
const onBlk=m=>{if(m.tk!==tk||m.t!=='scan')return;parts.push(...m.res);if(--left>0)return;
 try{BDm=BDm||new Function(WKSRC+';return mkDetector(BTP)')();const r=BDm.finish(Float32Array.from(g8),W,bh,parts);
  for(const yb of yel){if(r.every(o=>Math.abs(o.x-yb.x)>=100||Math.abs(o.y-yb.y)>=100))r.push(yb)}
  dets=r.map(o=>({x:Math.max(B.l,Math.min(B.r,o.x)),y:o.y+435,k:o.k,sc:o.sc}))}catch(err){console.error(err)}
 blkBusy=false;upd();drawDets()};
const onChars=m=>{if(m.tk!==tk)return;if(m.t==='put'){applyBest(m.best,y0);upd()}else if(m.t==='chars'){applyBest(m.best,y0);dedupeDet();upd()}};
for(const g of groups)runJob(newW(),{t:'scan',tk,g:g8,W,H:bh,idx:g},onBlk);
runJob(newW(),{t:'chars',tk,id,W,h},onChars,[id.buffer])}
function findYellow(d,W,H){const w=W>>1,h=H>>1,m=new Uint8Array(w*h);
for(let y=0;y<h;y++)for(let x=0;x<w;x++){const i=((y*2)*W+x*2)*4,r=d[i],g=d[i+1],b=d[i+2];if(r>190&&g>150&&b<110&&r-b>100&&g-b>70)m[y*w+x]=1}
const out=[],st=[];
for(let p0=0;p0<m.length;p0++){if(m[p0]!==1)continue;let x0=1e9,x1=-1,y0=1e9,y1=-1,n=0;m[p0]=2;st.push(p0);
while(st.length){const p=st.pop(),x=p%w,y=(p/w)|0;n++;if(x<x0)x0=x;if(x>x1)x1=x;if(y<y0)y0=y;if(y>y1)y1=y;
if(x>0&&m[p-1]===1){m[p-1]=2;st.push(p-1)}if(x<w-1&&m[p+1]===1){m[p+1]=2;st.push(p+1)}if(y>0&&m[p-w]===1){m[p-w]=2;st.push(p-w)}if(y<h-1&&m[p+w]===1){m[p+w]=2;st.push(p+w)}}
const bw=(x1-x0+1)*2,bh=(y1-y0+1)*2,fill=n*4/(bw*bh);
if(bw>=100&&bw<=150&&bh>=90&&bh<=135&&bw/bh>=.9&&bw/bh<=1.4&&fill>=.3){const cx=x0*2+bw/2,cy=y0*2+bh/2+2.5;if(cx>=37&&cx<=1169&&cy>=97&&cy<=1267)out.push({k:0,sc:1,x:cx,y:cy,yel:1})}}
return out}
function upd(){document.querySelectorAll('#zslots button').forEach(b=>b.style.opacity=det[+b.dataset.s]?'':'.4');const nk=[0,1,2].map(k=>dets.filter(d=>d.k===k).length);$('status').textContent='検出: '+TN.map((n,i)=>n+(det[i]?'○':'×')).join(' ')+(blkBusy?'　ブロック検出中…':dets.length?'　ブロック'+dets.length+'個':'')}
document.querySelectorAll('#zslots button').forEach(b=>b.onclick=()=>{const i=+b.dataset.s,t=det[i];if(!t){$('status').textContent=TN[i]+'を検出できませんでした';return}x=t.x;y=t.y;if(app.classList.contains('zblk'))$('zbx').click();pm='ang';pl();draw()});
['gesturestart','gesturechange','gestureend'].forEach(t=>document.addEventListener(t,e=>e.preventDefault()));let lastTE=0;document.addEventListener('touchend',e=>{const n=Date.now();if(e.cancelable&&n-lastTE<350&&!(e.target.closest&&e.target.closest('button,input,label,select,textarea')))e.preventDefault();lastTE=n},{passive:false});
pl();zs();draw();idb('get').then(f=>{if(f&&f.size)loadImg(f,false)}).catch(()=>{})})();</script><script>document.getElementById('zoom').onclick=function(){var z=document.querySelector('.app').classList.toggle('zoomed');this.textContent=z?'戻る':'拡大'}</script></body></html>
