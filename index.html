function mkDetector(TP){
  const KINDS=[
    {k:0,key:'pyr',  cx:70, cy:67,  thr:0.78},
    {k:1,key:'panel',cx:86, cy:77,  thr:0.72},
    {k:2,key:'sword',cx:86, cy:77,  thr:0.75}
  ];
  function dec(t){const b=atob(t.d),a=new Float32Array(t.w*t.h);for(let i=0;i<a.length;i++)a[i]=b.charCodeAt(i);return{w:t.w,h:t.h,a}}
  function octMask(w,h,c){const m=new Uint8Array(w*h);for(let y=0;y<h;y++)for(let x=0;x<w;x++){m[y*w+x]=(x+y>=c&&(w-1-x)+y>=c&&x+(h-1-y)>=c&&(w-1-x)+(h-1-y)>=c)?1:0}return m}
  const tpls=KINDS.map(K=>{
    const t=dec(TP[K.key]);let m;
    if(K.key==='pyr')m=new Uint8Array(t.w*t.h).fill(1);
    else{m=octMask(t.w,t.h,11);if(K.key==='sword'){for(let y=8;y<=59;y++)for(let x=15;x<=73;x++)m[y*t.w+x]=0}}
    return{K,w:t.w,h:t.h,a:t.a,m}
  });
  function half(src,W,H){const w=W>>1,h=H>>1,o=new Float32Array(w*h);for(let y=0;y<h;y++)for(let x=0;x<w;x++){const i=(2*y)*W+2*x;o[y*w+x]=(src[i]+src[i+1]+src[i+W]+src[i+W+1])/4}return{a:o,w,h}}
  function tHalf(t){const w=t.w>>1,h=t.h>>1,a=new Float32Array(w*h),m=new Uint8Array(w*h);for(let y=0;y<h;y++)for(let x=0;x<w;x++){const i=2*y*t.w+2*x;a[y*w+x]=(t.a[i]+t.a[i+1]+t.a[i+t.w]+t.a[i+t.w+1])/4;m[y*w+x]=(t.m[i]+t.m[i+1]+t.m[i+t.w]+t.m[i+t.w+1])>=3?1:0}return{w,h,a,m,K:t.K}}
  function prep(t,W){ // 差分オフセット・ゼロ平均テンプレ
    const off=[],tv=[];let s=0,n=0;for(let y=0;y<t.h;y++)for(let x=0;x<t.w;x++)if(t.m[y*t.w+x]){off.push(y*W+x);tv.push(t.a[y*t.w+x]);s+=t.a[y*t.w+x];n++}
    const mu=s/n;let s2=0;const tp=new Float32Array(n);for(let i=0;i<n;i++){tp[i]=tv[i]-mu;s2+=tp[i]*tp[i]}
    return{off:Int32Array.from(off),tp,n,s2,w:t.w,h:t.h}
  }
  function ncc(I,p,pos){let sI=0,sII=0,sIT=0;const o=p.off,tp=p.tp,n=p.n;for(let i=0;i<n;i++){const v=I[pos+o[i]];sI+=v;sII+=v*v;sIT+=v*tp[i]}const va=sII-sI*sI/n;if(va<n*25)return -1;return sIT/Math.sqrt(va*p.s2)}
  async function run(g,W,H,yield_,cancel){
    const h1=half(g,W,H),h2=half(h1.a,h1.w,h1.h); // h1:1/2, h2:1/4
    const res=[];let pyP1=null;
    for(const T of tpls){
      const T1={w:T.w,h:T.h,a:T.a,m:T.m,K:T.K},T2=tHalf(T1);
      const p2=prep(T2,h2.w),p1=prep(T1,h1.w);if(T.K.k===0)pyP1=p1;
      const cand=[];
      for(let Y=0;Y+T2.h<=h2.h;Y+=2){
        for(let X=0;X+T2.w<=h2.w;X+=2){const s=ncc(h2.a,p2,Y*h2.w+X);if(s>=0.35)cand.push({s,X,Y})}
        if(yield_&&(Y%16===0)){await yield_();if(cancel&&cancel())return[]}
      }
      cand.sort((a,b)=>b.s-a.s);
      const kept=[];
      for(const c of cand){if(kept.length>=40)break;if(kept.every(k=>Math.hypot(k.X-c.X,k.Y-c.Y)>=12))kept.push(c)}
      for(const c of kept){
        let best=-2,bx=0,by=0;
        for(let dy=-4;dy<=4;dy++)for(let dx=-4;dx<=4;dx++){const X=c.X*2+dx,Y=c.Y*2+dy;if(X<0||Y<0||X+T1.w>h1.w||Y+T1.h>h1.h)continue;const s=ncc(h1.a,p1,Y*h1.w+X);if(s>best){best=s;bx=X;by=Y}}
        if(best>=T.K.thr)res.push({k:T.K.k,sc:best,x:bx*2+T.K.cx,y:by*2+T.K.cy})
      }
    }
    res.sort((a,b)=>b.sc-a.sc);const out=[];
    for(const r of res){if(out.every(o=>Math.abs(o.x-r.x)>=100||Math.abs(o.y-r.y)>=100))out.push(r)}
    const BL=47,BR=1159,BTr=502-435,BBr=1762-435;
    let o2=out.filter(o=>o.x>=BL-10&&o.x<=BR+10&&o.y>=BTr+30&&o.y<=BBr-60);
    const PT=150;
    function probe(cx,cy){let best=-2,bx=0,by=0;const X0=Math.round((cx-70)/2),Y0=Math.round((cy-67)/2);
      for(let dy=-3;dy<=3;dy++)for(let dx=-3;dx<=3;dx++){const X=X0+dx,Y=Y0+dy;if(X<0||Y<0||X+pyP1.w>h1.w||Y+pyP1.h>h1.h)continue;const s=ncc(h1.a,pyP1,Y*h1.w+X);if(s>best){best=s}}
      return best}
    const free=(x,y)=>o2.every(o=>Math.abs(o.x-x)>=100||Math.abs(o.y-y)>=100);
    const cols=[];
    for(const o of o2.filter(o=>o.k===0).sort((a,b)=>a.y-b.y)){let c=cols.find(c=>Math.abs(c.x-o.x)<=8);if(!c){c={x:o.x,l:[]};cols.push(c)}c.l.push(o)}
    for(const c of cols){
      for(let i=0;i+1<c.l.length;i++){const a=c.l[i],b=c.l[i+1],dy=b.y-a.y,n=Math.round(dy/PT);
        if(n>=2&&Math.abs(dy-PT*n)<=16)for(let j=1;j<n;j++){const x=(a.x+b.x)/2,y=a.y+dy*j/n;if(free(x,y)&&probe(x,y)>=0.1)o2.push({k:0,sc:0.1,x,y,inf:1})}}
      for(const dir of [-1,1]){
        const e=dir<0?c.l[0]:c.l[c.l.length-1];let x=e.x,y=e.y;
        for(let s=0;s<8;s++){y+=dir*PT;if(y<BTr+30||y>BBr-60)break;if(!free(x,y))break;const sc=probe(x,y);if(sc<0.4)break;o2.push({k:0,sc,x,y,inf:1})}}
    }
    return o2
  }
  return{run}
