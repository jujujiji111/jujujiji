<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<title>モンスト反射ガイド</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  background: #17191e;
  color: white;
  font-family: sans-serif;
  overflow-x: hidden;
}

#app {
  width: 100%;
  max-width: 900px;
  margin: auto;
  padding: 10px;
}

h2 {
  text-align: center;
  margin: 8px 0 12px;
}

#board {
  width: 100%;
  display: block;
  background: #292d35;
  border: 2px solid #555;
  border-radius: 8px;
  touch-action: none;
}

.controls {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
  margin-top: 10px;
  justify-content: center;
}

button, select {
  border: 1px solid #777;
  border-radius: 7px;
  padding: 10px 14px;
  background: #e5e5e5;
  color: black;
  font-size: 14px;
  font-weight: bold;
}

button:active {
  background: #aaa;
}

button.active {
  background: #333;
  color: white;
}

.info {
  text-align: center;
  margin-top: 10px;
  color: #ddd;
  font-size: 13px;
}

.reflection-control {
  display: flex;
  align-items: center;
  gap: 12px;
  justify-content: center;
  margin-top: 10px;
}

.reflection-control button {
  min-width: 45px;
  font-size: 20px;
}

#reflectionCount {
  min-width: 90px;
  text-align: center;
  font-weight: bold;
}
</style>
</head>

<body>
<div id="app">

<h2>モンスト反射ガイド</h2>

<svg id="board" viewBox="0 0 1206 2622">

<defs>
  <clipPath id="boardClip">
    <rect x="0" y="0" width="1206" height="2622"/>
  </clipPath>
</defs>

<g clip-path="url(#boardClip)">

<!-- 背景 -->
<rect width="1206" height="2622" fill="#292d35"/>

<!-- 壁 -->
<rect id="wall"
      x="44" y="502"
      width="1118" height="1260"
      fill="none"
      stroke="#aaa"
      stroke-width="8"/>

<!-- 軌道の白い外側 -->
<polyline id="pathBorder"
          fill="none"
          stroke="white"
          stroke-width="109.1"
          stroke-linecap="round"
          stroke-linejoin="round"/>

<!-- 軌道 -->
<polyline id="pathBand"
          fill="none"
          stroke="#45d9ff"
          stroke-opacity="0.5"
          stroke-width="105.1"
          stroke-linecap="round"
          stroke-linejoin="round"/>

<!-- 軌道中央線 -->
<polyline id="pathLine"
          fill="none"
          stroke="black"
          stroke-width="5"
          stroke-linecap="round"
          stroke-linejoin="round"/>

<!-- 延長線 -->
<line id="extension"
      stroke="white"
      stroke-width="4"
      stroke-dasharray="none"
      opacity="0.8"/>

<!-- 反射位置 -->
<g id="bouncePoints"></g>

<!-- ブロック -->
<g id="blocks"></g>

<!-- 発射円 -->
<circle id="launchCircle"
        cx="603"
        cy="1132"
        r="89.7"
        fill="#45d9ff"
        fill-opacity="0.5"
        stroke="white"
        stroke-width="4"/>

<!-- 発射円中心 -->
<circle id="launchOuter"
        cx="603" cy="1132"
        r="15"
        fill="white"/>

<circle id="launchMiddle"
        cx="603" cy="1132"
        r="10"
        fill="black"/>

<circle id="launchInner"
        cx="603" cy="1132"
        r="5"
        fill="#45d9ff"/>

<!-- 狙い方向のハンドル -->
<line id="aimLine"
      stroke="#fff"
      stroke-width="5"/>

<circle id="aimHandle"
        r="18"
        fill="#ffdc36"
        stroke="white"
        stroke-width="4"/>

</g>
</svg>

<div class="reflection-control">
  <button id="minus">－</button>
  <span id="reflectionCount">反射 6回</span>
  <button id="plus">＋</button>
</div>

<div class="controls">
  <button id="addBlock">ブロック追加</button>
  <button id="fixBlock">固定</button>
  <button id="deleteBlock">削除</button>
</div>

<div class="controls">
  <button id="wallToggle" class="active">壁 ON</button>
  <button id="colorToggle">軌道色変更</button>
  <button id="reset">リセット</button>
</div>

<div class="info">
  発射円をドラッグ：発射位置変更<br>
  黄色い丸をドラッグ：発射角度変更<br>
  ブロックをタップ：選択・移動
</div>

</div>

<script>
const svg = document.getElementById("board");

const NS = "http://www.w3.org/2000/svg";

const WALL = {
  left: 44,
  right: 1162,
  top: 502,
  bottom: 1762
};

const PATH_WIDTH = 105.1;
const PATH_RADIUS = PATH_WIDTH / 2;

const MONSTER_RADIUS = 70;
const COLLISION_RADIUS = MONSTER_RADIUS + PATH_RADIUS;

let launch = { x: 603, y: 1132 };
let angle = -45;
let reflectionLimit = 6;

let blocks = [];
let selectedBlock = -1;
let dragging = null;
let wallEnabled = true;
let whitePath = false;

const pathBorder = document.getElementById("pathBorder");
const pathBand = document.getElementById("pathBand");
const pathLine = document.getElementById("pathLine");
const extension = document.getElementById("extension");
const bouncePoints = document.getElementById("bouncePoints");
const blocksGroup = document.getElementById("blocks");

function pointFromEvent(e) {
  const p = svg.createSVGPoint();
  p.x = e.clientX;
  p.y = e.clientY;
  return p.matrixTransform(svg.getScreenCTM().inverse());
}

function setPosition(el, x, y) {
  el.setAttribute("cx", x);
  el.setAttribute("cy", y);
}

function distance(a, b) {
  return Math.hypot(a.x - b.x, a.y - b.y);
}

function normalize(x, y) {
  const d = Math.hypot(x, y) || 1;
  return { x: x / d, y: y / d };
}

function reflect(v, n) {
  const dot = v.x * n.x + v.y * n.y;
  return {
    x: v.x - 2 * dot * n.x,
    y: v.y - 2 * dot * n.y
  };
}

function rayCircle(origin, dir, center, radius) {
  const ox = origin.x - center.x;
  const oy = origin.y - center.y;

  const b = ox * dir.x + oy * dir.y;
  const c = ox * ox + oy * oy - radius * radius;

  const discriminant = b * b - c;

  if (discriminant < 0) return null;

  const t = -b - Math.sqrt(discriminant);

  if (t <= 0.01) return null;

  return {
    t,
    x: origin.x + dir.x * t,
    y: origin.y + dir.y * t
  };
}

function rayWall(origin, dir) {
  let hits = [];

  if (dir.x > 0) {
    const t = (WALL.right - origin.x) / dir.x;
    if (t > 0.01) hits.push({
      t, x: WALL.right, y: origin.y + dir.y * t,
      nx: -1, ny: 0
    });
  }

  if (dir.x < 0) {
    const t = (WALL.left - origin.x) / dir.x;
    if (t > 0.01) hits.push({
      t, x: WALL.left, y: origin.y + dir.y * t,
      nx: 1, ny: 0
    });
  }

  if (dir.y > 0) {
    const t = (WALL.bottom - origin.y) / dir.y;
    if (t > 0.01) hits.push({
      t, x: origin.x + dir.x * t, y: WALL.bottom,
      nx: 0, ny: -1
    });
  }

  if (dir.y < 0) {
    const t = (WALL.top - origin.y) / dir.y;
    if (t > 0.01) hits.push({
      t, x: origin.x + dir.x * t, y: WALL.top,
      nx: 0, ny: 1
    });
  }

  hits = hits.filter(h =>
    h.x >= WALL.left - 1 &&
    h.x <= WALL.right + 1 &&
    h.y >= WALL.top - 1 &&
    h.y <= WALL.bottom + 1
  );

  hits.sort((a, b) => a.t - b.t);

  return hits[0] || null;
}

function tracePath() {
  let points = [{ x: launch.x, y: launch.y }];
  let bounces = [];

  let dir = {
    x: Math.cos(angle * Math.PI / 180),
    y: Math.sin(angle * Math.PI / 180)
  };

  let origin = { ...launch };

  for (let i = 0; i < reflectionLimit; i++) {
    let wallHit = wallEnabled ? rayWall(origin, dir) : null;

    let blockHit = null;
    let hitBlockIndex = -1;

    blocks.forEach((block, index) => {
      const hit = rayCircle(
        origin,
        dir,
        block,
        COLLISION_RADIUS
      );

      if (hit && (!blockHit || hit.t < blockHit.t)) {
        blockHit = hit;
        hitBlockIndex = index;
      }
    });

    let hit = null;
    let normal = null;

    if (wallHit && (!blockHit || wallHit.t < blockHit.t)) {
      hit = wallHit;
      normal = { x: wallHit.nx, y: wallHit.ny };
    } else if (blockHit) {
      hit = blockHit;

      const block = blocks[hitBlockIndex];
      normal = normalize(
        hit.x - block.x,
        hit.y - block.y
      );
    }

    if (!hit) {
      let end = {
        x: origin.x + dir.x * 3000,
        y: origin.y + dir.y * 3000
      };

      points.push(end);
      break;
    }

    points.push({ x: hit.x, y: hit.y });
    bounces.push({ x: hit.x, y: hit.y });

    dir = normalize(
      reflect(dir, normal).x,
      reflect(dir, normal).y
    );

    origin = {
      x: hit.x + dir.x * 0.5,
      y: hit.y + dir.y * 0.5
    };
  }

  return { points, bounces };
}

function pointsString(points) {
  return points.map(p => `${p.x},${p.y}`).join(" ");
}

function drawBlocks() {
  blocksGroup.innerHTML = "";

  blocks.forEach((b, index) => {
    const group = document.createElementNS(NS, "g");
    group.setAttribute("transform", `translate(${b.x},${b.y})`);
    group.style.cursor = b.fixed ? "default" : "grab";

    const circle = document.createElementNS(NS, "circle");
    circle.setAttribute("r", MONSTER_RADIUS);
    circle.setAttribute("fill", index === selectedBlock ? "#e1a6ff" : "#9a75d1");
    circle.setAttribute("stroke", index === selectedBlock ? "red" : "#eee");
    circle.setAttribute("stroke-width", index === selectedBlock ? 12 : 5);

    const text = document.createElementNS(NS, "text");
    text.textContent = index + 1;
    text.setAttribute("text-anchor", "middle");
    text.setAttribute("dominant-baseline", "central");
    text.setAttribute("font-size", "42");
    text.setAttribute("font-weight", "bold");
    text.setAttribute("fill", "white");

    group.appendChild(circle);
    group.appendChild(text);

    group.addEventListener("pointerdown", e => {
      e.stopPropagation();
      selectedBlock = index;

      if (!b.fixed) {
        dragging = { type: "block", index };
      }

      draw();
    });

    blocksGroup.appendChild(group);
  });
}

function drawBounces(bounces) {
  bouncePoints.innerHTML = "";

  bounces.forEach(p => {
    const c = document.createElementNS(NS, "circle");
    c.setAttribute("cx", p.x);
    c.setAttribute("cy", p.y);
    c.setAttribute("r", 13);
    c.setAttribute("fill", "#ffe044");
    c.setAttribute("stroke", "white");
    c.setAttribute("stroke-width", 4);
    bouncePoints.appendChild(c);
  });
}

function draw() {
  const result = tracePath();
  const str = pointsString(result.points);

  pathBorder.setAttribute("points", str);
  pathBand.setAttribute("points", str);
  pathLine.setAttribute("points", str);

  const pathColor = whitePath ? "white" : "black";
  const extensionColor = whitePath ? "black" : "white";

  pathLine.setAttribute("stroke", pathColor);

  pathBand.setAttribute("stroke", whitePath ? "#ffffff" : "#45d9ff");
  pathBand.setAttribute("stroke-opacity", "0.5");

  pathBorder.setAttribute("stroke", "white");

  extension.setAttribute("stroke", extensionColor);

  const first = result.points[1] || launch;

  extension.setAttribute("x1", first.x);
  extension.setAttribute("y1", first.y);
  extension.setAttribute("x2", first.x + Math.cos(angle * Math.PI / 180) * 1500);
  extension.setAttribute("y2", first.y + Math.sin(angle * Math.PI / 180) * 1500);

  const handleDistance = 180;

  const hx = launch.x + Math.cos(angle * Math.PI / 180) * handleDistance;
  const hy = launch.y + Math.sin(angle * Math.PI / 180) * handleDistance;

  setPosition(document.getElementById("launchCircle"), launch.x, launch.y);
  setPosition(document.getElementById("launchOuter"), launch.x, launch.y);
  setPosition(document.getElementById("launchMiddle"), launch.x, launch.y);
  setPosition(document.getElementById("launchInner"), launch.x, launch.y);

  const aimLine = document.getElementById("aimLine");
  aimLine.setAttribute("x1", launch.x);
  aimLine.setAttribute("y1", launch.y);
  aimLine.setAttribute("x2", hx);
  aimLine.setAttribute("y2", hy);

  setPosition(document.getElementById("aimHandle"), hx, hy);

  drawBounces(result.bounces);
  drawBlocks();
}

svg.addEventListener("pointerdown", e => {
  const p = pointFromEvent(e);

  if (distance(p, launch) < 100) {
    dragging = { type: "launch" };
  } else {
    const hx = launch.x + Math.cos(angle * Math.PI / 180) * 180;
    const hy = launch.y + Math.sin(angle * Math.PI / 180) * 180;

    if (distance(p, { x: hx, y: hy }) < 45) {
      dragging = { type: "angle" };
    }
  }

  svg.setPointerCapture(e.pointerId);
});

svg.addEventListener("pointermove", e => {
  if (!dragging) return;

  const p = pointFromEvent(e);

  if (dragging.type === "launch") {
    launch.x = Math.max(100, Math.min(1100, p.x));
    launch.y = Math.max(200, Math.min(2400, p.y));
  }

  if (dragging.type === "angle") {
    angle = Math.atan2(p.y - launch.y, p.x - launch.x) * 180 / Math.PI;
  }

  if (dragging.type === "block") {
    const b = blocks[dragging.index];

    if (b && !b.fixed) {
      b.x = p.x;
      b.y = p.y;
    }
  }

  draw();
});

svg.addEventListener("pointerup", () => {
  dragging = null;
});

svg.addEventListener("pointercancel", () => {
  dragging = null;
});

document.getElementById("plus").onclick = () => {
  reflectionLimit = Math.min(30, reflectionLimit + 1);
  updateCount();
  draw();
};

document.getElementById("minus").onclick = () => {
  reflectionLimit = Math.max(0, reflectionLimit - 1);
  updateCount();
  draw();
};

function updateCount() {
  document.getElementById("reflectionCount").textContent =
    `反射 ${reflectionLimit}回`;
}

document.getElementById("addBlock").onclick = () => {
  blocks.push({
    x: 603,
    y: 900,
    fixed: false
  });

  selectedBlock = blocks.length - 1;
  draw();
};

document.getElementById("fixBlock").onclick = () => {
  if (selectedBlock < 0) return;

  blocks[selectedBlock].fixed =
    !blocks[selectedBlock].fixed;

  document.getElementById("fixBlock").textContent =
    blocks[selectedBlock].fixed ? "固定解除" : "固定";

  draw();
};

document.getElementById("deleteBlock").onclick = () => {
  if (selectedBlock < 0) return;

  blocks.splice(selectedBlock, 1);
  selectedBlock = -1;

  document.getElementById("fixBlock").textContent = "固定";

  draw();
};

document.getElementById("wallToggle").onclick = e => {
  wallEnabled = !wallEnabled;

  document.getElementById("wall").style.display =
    wallEnabled ? "block" : "none";

  e.target.textContent = wallEnabled ? "壁 ON" : "壁 OFF";
  e.target.classList.toggle("active", wallEnabled);

  draw();
};

document.getElementById("colorToggle").onclick = () => {
  whitePath = !whitePath;
  draw();
};

document.getElementById("reset").onclick = () => {
  launch = { x: 603, y: 1132 };
  angle = -45;
  reflectionLimit = 6;
  blocks = [];
  selectedBlock = -1;
  wallEnabled = true;
  whitePath = false;

  document.getElementById("wall").style.display = "block";
  document.getElementById("wallToggle").textContent = "壁 ON";
  document.getElementById("wallToggle").classList.add("active");
  document.getElementById("fixBlock").textContent = "固定";

  updateCount();
  draw();
};

updateCount();
draw();
</script>

</body>
</html>
