<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<title>モンスト反射ガイド</title>

<style>
* { box-sizing: border-box; }

body {
  margin: 0;
  background: #17191e;
  color: white;
  font-family: sans-serif;
  overflow-x: hidden;
}

#app {
  width: min(100%, 520px);
  margin: auto;
  padding: 10px;
}

h2 {
  margin: 5px 0 10px;
  text-align: center;
  font-size: 20px;
}

#board {
  position: relative;
  width: 100%;
  aspect-ratio: 1206 / 2622;
  background: #20242b;
  border: 1px solid #444b55;
  overflow: hidden;
  touch-action: none;
}

svg {
  display: block;
  width: 100%;
  height: 100%;
}

button, input {
  font: inherit;
}

button {
  border: 1px solid #555e69;
  border-radius: 6px;
  padding: 9px 12px;
  background: #303640;
  color: white;
}

button.active {
  background: #55d9df;
  color: #101820;
  border-color: #55d9df;
}

button:active {
  filter: brightness(1.2);
}

.tabs, .row {
  display: flex;
  gap: 6px;
  margin-top: 8px;
}

.tabs button {
  flex: 1;
}

.panel {
  margin-top: 8px;
  padding: 10px;
  background: #222831;
  border: 1px solid #3d4652;
  border-radius: 8px;
}

.panel label {
  display: block;
  margin: 5px 0;
  font-size: 13px;
}

input[type="number"] {
  width: 80px;
  padding: 7px;
  background: #15191f;
  color: white;
  border: 1px solid #59616d;
  border-radius: 5px;
}

input[type="range"] {
  width: 100%;
}

.small {
  font-size: 12px;
  color: #c2c9d2;
}

#reflection {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 12px;
  margin-top: 8px;
  padding: 8px;
  background: #222831;
  border-radius: 8px;
}

#reflection button {
  min-width: 42px;
}

.hidden {
  display: none !important;
}

</style>
</head>

<body>
<div id="app">

<h2>モンスト反射ガイド</h2>

<div id="board">
<svg id="svg" viewBox="0 0 1206 2622">
<defs>
  <clipPath id="wallClip">
    <path d="M43 502 H1163 V1762 H43 Z"/>
  </clipPath>
</defs>

<!-- 壁 -->
<path d="M43 502 H1163 V1762 H43 Z"
      fill="none"
      stroke="#e6e9ed"
      stroke-width="12"/>

<!-- 軌道 -->
<g clip-path="url(#wallClip)">
  <path id="trajectoryOutline"
        fill="none"
        stroke="white"
        stroke-width="115"
        stroke-linecap="round"
        stroke-linejoin="round"/>

  <path id="trajectory"
        fill="none"
        stroke="#55d9df"
        stroke-width="105.1"
        stroke-opacity=".5"
        stroke-linecap="round"
        stroke-linejoin="round"/>

  <path id="extension"
        fill="none"
        stroke="white"
        stroke-width="5"
        stroke-dasharray="12 10"/>

  <path id="redLine"
        fill="none"
        stroke="#ff4545"
        stroke-width="5"/>

  <g id="markers"></g>
  <g id="blocks"></g>
</g>

<!-- 発射点 -->
<circle id="launchCircle"
        cx="591" cy="700" r="89.7"
        fill="#55d9df"
        fill-opacity=".5"/>

<circle cx="591" cy="700" r="13" fill="white"/>
<circle cx="591" cy="700" r="9" fill="#15191f"/>
<circle cx="591" cy="700" r="5" fill="#55d9df"/>

</svg>
</div>

<div class="tabs">
  <button id="tabLaunch" class="active">発射点</button>
  <button id="tabAngle">角度</button>
  <button id="tabBlock">ブロック</button>
</div>

<!-- 発射点 -->
<div id="launchPanel" class="panel">
  <div class="row">
    <label>X
      <input id="posX" type="number" value="591">
    </label>
    <label>Y
      <input id="posY" type="number" value="700">
    </label>
  </div>
  <p class="small">発射点をドラッグして移動できます。</p>
</div>

<!-- 角度 -->
<div id="anglePanel" class="panel hidden">
  <label>角度：<span id="angleText">63.63</span>°</label>
  <input id="angle" type="range" min="0" max="360" step=".01" value="63.6328125">
  <div class="row">
    <button id="angleMinusBig">−3.52°</button>
    <button id="angleMinus">−0.35°</button>
    <button id="anglePlus">＋0.35°</button>
    <button id="anglePlusBig">＋3.52°</button>
  </div>
</div>

<!-- ブロック -->
<div id="blockPanel" class="panel hidden">
  <div class="row">
    <button id="addBlock">追加</button>
    <button id="fixBlock">固定</button>
    <button id="deleteBlock">削除</button>
  </div>
  <p class="small" id="blockStatus">「追加」でブロックを配置できます。</p>
</div>

<!-- 反射回数 -->
<div id="reflection">
  <button id="reflectionMinus">−</button>
  <strong>反射 <span id="reflectionCount">5</span>回</strong>
  <button id="reflectionPlus">＋</button>
</div>

<div class="panel">
  <div class="row">
    <button id="toggleWidth" class="active">軌道幅 ON</button>
    <button id="toggleWall" class="active">壁 ON</button>
    <button id="reset">リセット</button>
  </div>

  <div class="row">
    <button id="toggleExtension" class="active">延長線 ON</button>
    <button id="toggleRed" class="active">赤線 ON</button>
    <button id="toggleMarks" class="active">反射点 ON</button>
  </div>

  <div class="row">
    <label class="small">
      軌道色
      <input type="color" id="lineColor" value="#55d9df">
    </label>
  </div>
</div>

</div>

<script>
const svg = document.getElementById("svg");
const NS = "http://www.w3.org/2000/svg";

const wall = {
  left: 43,
  right: 1163,
  top: 502,
  bottom: 1762
};

let launch = { x: 591, y: 700 };
let angle = 63.6328125;
let reflectionCount = 5;

let blocks = [];
let pendingBlock = null;
let mode = "launch";
let deleteMode = false;

let showWidth = true;
let showWall = true;
let showExtension = true;
let showRed = true;
let showMarks = true;

const $ = id => document.getElementById(id);

function makeSvg(tag, attrs) {
  const el = document.createElementNS(NS, tag);
  for (const [k, v] of Object.entries(attrs)) {
    el.setAttribute(k, v);
  }
  return el;
}

function setMode(next) {
  mode = next;

  $("tabLaunch").classList.toggle("active", next === "launch");
  $("tabAngle").classList.toggle("active", next === "angle");
  $("tabBlock").classList.toggle("active", next === "block");

  $("launchPanel").classList.toggle("hidden", next !== "launch");
  $("anglePanel").classList.toggle("hidden", next !== "angle");
  $("blockPanel").classList.toggle("hidden", next !== "block");

  deleteMode = false;
  update();
}

$("tabLaunch").onclick = () => setMode("launch");
$("tabAngle").onclick = () => setMode("angle");
$("tabBlock").onclick = () => setMode("block");

function updateInputs() {
  $("posX").value = Math.round(launch.x);
  $("posY").value = Math.round(launch.y);
  $("angle").value = angle;
  $("angleText").textContent = angle.toFixed(2);
  $("reflectionCount").textContent = reflectionCount;
}

function calculatePath() {
  const points = [];
  const hits = [];

  let x = launch.x;
  let y = launch.y;

  let dx = Math.cos(angle * Math.PI / 180);
  let dy = Math.sin(angle * Math.PI / 180);

  points.push([x, y]);

  for (let i = 0; i < reflectionCount; i++) {
    let bestT = Infinity;
    let hitX = x;
    let hitY = y;
    let nx = 0;
    let ny = 0;
    let hitBlock = -1;

    // 壁との衝突
    if (dx > 0) {
      const t = (wall.right - x) / dx;
      if (t > 0 && t < bestT && y + dy * t >= wall.top && y + dy * t <= wall.bottom) {
        bestT = t;
        hitX = wall.right;
        hitY = y + dy * t;
        nx = -1;
        ny = 0;
        hitBlock = -1;
      }
    }

    if (dx < 0) {
      const t = (wall.left - x) / dx;
      if (t > 0 && t < bestT && y + dy * t >= wall.top && y + dy * t <= wall.bottom) {
        bestT = t;
        hitX = wall.left;
        hitY = y + dy * t;
        nx = 1;
        ny = 0;
        hitBlock = -1;
      }
    }

    if (dy > 0) {
      const t = (wall.bottom - y) / dy;
      if (t > 0 && t < bestT && x + dx * t >= wall.left && x + dx * t <= wall.right) {
        bestT = t;
        hitX = x + dx * t;
        hitY = wall.bottom;
        nx = 0;
        ny = -1;
        hitBlock = -1;
      }
    }

    if (dy < 0) {
      const t = (wall.top - y) / dy;
      if (t > 0 && t < bestT && x + dx * t >= wall.left && x + dx * t <= wall.right) {
        bestT = t;
        hitX = x + dx * t;
        hitY = wall.top;
        nx = 0;
        ny = 1;
        hitBlock = -1;
      }
    }

    // 円形ブロックとの衝突
    const radius = 70 + 52.55;

    blocks.forEach((b, index) => {
      const ox = x - b.x;
      const oy = y - b.y;

      const a = dx * dx + dy * dy;
      const bb = 2 * (ox * dx + oy * dy);
      const c = ox * ox + oy * oy - radius * radius;

      const disc = bb * bb - 4 * a * c;
      if (disc < 0) return;

      const t = (-bb - Math.sqrt(disc)) / (2 * a);
      if (t > 0 && t < bestT) {
        bestT = t;
        hitX = x + dx * t;
        hitY = y + dy * t;

        const len = Math.hypot(hitX - b.x, hitY - b.y);
        nx = (hitX - b.x) / len;
        ny = (hitY - b.y) / len;
        hitBlock = index;
      }
    });

    if (!Number.isFinite(bestT)) break;

    points.push([hitX, hitY]);
    hits.push([hitX, hitY]);

    const dot = dx * nx + dy * ny;
    dx = dx - 2 * dot * nx;
    dy = dy - 2 * dot * ny;

    x = hitX + dx * 0.1;
    y = hitY + dy * 0.1;
  }

  // 最後の軌道を壁の端まで伸ばす
  let endT = Infinity;

  if (dx > 0) endT = Math.min(endT, (wall.right - x) / dx);
  if (dx < 0) endT = Math.min(endT, (wall.left - x) / dx);
  if (dy > 0) endT = Math.min(endT, (wall.bottom - y) / dy);
  if (dy < 0) endT = Math.min(endT, (wall.top - y) / dy);

  if (Number.isFinite(endT) && endT > 0) {
    points.push([x + dx * endT, y + dy * endT]);
  }

  return { points, hits };
}

function pathData(points) {
  return points.map((p, i) =>
    `${i === 0 ? "M" : "L"} ${p[0]} ${p[1]}`
  ).join(" ");
}

function update() {
  updateInputs();

  const { points, hits } = calculatePath();
  const d = pathData(points);

  $("trajectory").setAttribute("d", d);
  $("trajectoryOutline").setAttribute("d", d);

  $("trajectory").style.display = showWidth ? "" : "none";
  $("trajectoryOutline").style.display = showWidth ? "" : "none";

  $("trajectory").setAttribute("stroke", $("lineColor").value);

  $("extension").style.display = showExtension ? "" : "none";
  $("redLine").style.display = showRed ? "" : "none";

  // 初回反射後の延長線
  if (hits.length > 0) {
    const first = hits[0];
    const second = points[2] || first;
    const dx = second[0] - first[0];
    const dy = second[1] - first[1];

    const len = Math.hypot(dx, dy) || 1;
    const ex = first[0] + dx / len * 220;
    const ey = first[1] + dy / len * 220;

    $("extension").setAttribute(
      "d",
      `M ${first[0]} ${first[1]} L ${ex} ${ey}`
    );

    const opposite = $("lineColor").value.toLowerCase() === "#000000"
      ? "white" : "black";
    $("extension").setAttribute("stroke", opposite);
  } else {
    $("extension").setAttribute("d", "");
  }

  // 発射点から逆方向への赤線
  const dx = Math.cos(angle * Math.PI / 180);
  const dy = Math.sin(angle * Math.PI / 180);

  $("redLine").setAttribute(
    "d",
    `M ${launch.x} ${launch.y} L ${launch.x - dx * 1600} ${launch.y - dy * 1600}`
  );

  // 反射点
  $("markers").innerHTML = "";

  if (showMarks) {
    hits.forEach(([x, y]) => {
      $("markers").appendChild(
        makeSvg("circle", {
          cx: x, cy: y, r: 13,
          fill: "#ffe34d",
          stroke: "#fff",
          "stroke-width": 3
        })
      );
    });
  }

  // 発射点
  $("launchCircle").setAttribute("cx", launch.x);
  $("launchCircle").setAttribute("cy", launch.y);

  svg.querySelectorAll(".launchDot").forEach(e => e.remove());

  const dot1 = makeSvg("circle", {
    cx: launch.x, cy: launch.y, r: 13,
    fill: "white", class: "launchDot"
  });
  const dot2 = makeSvg("circle", {
    cx: launch.x, cy: launch.y, r: 9,
    fill: "#15191f", class: "launchDot"
  });
  const dot3 = makeSvg("circle", {
    cx: launch.x, cy: launch.y, r: 5,
    fill: "#55d9df", class: "launchDot"
  });

  svg.append(dot1, dot2, dot3);

  // 壁
  const wallPath = svg.querySelector("path[stroke='#e6e9ed']");
  if (wallPath) wallPath.style.display = showWall ? "" : "none";

  // ブロック
  $("blocks").innerHTML = "";

  blocks.forEach((b, i) => {
    $("blocks").appendChild(makeSvg("circle", {
      cx: b.x, cy: b.y, r: 70,
      fill: "#55d9df",
      "fill-opacity": ".5",
      stroke: "#ff4545",
      "stroke-width": 8
    }));
  });

  if (pendingBlock) {
    $("blocks").appendChild(makeSvg("circle", {
      cx: pendingBlock.x,
      cy: pendingBlock.y,
      r: 70,
      fill: "#55d9df",
      "fill-opacity": ".5",
      stroke: "white",
      "stroke-width": 7,
      "stroke-dasharray": "15 10"
    }));
  }
}

$("posX").onchange = () => {
  launch.x = Number($("posX").value);
  update();
};

$("posY").onchange = () => {
  launch.y = Number($("posY").value);
  update();
};

$("angle").oninput = () => {
  angle = Number($("angle").value);
  update();
};

$("angleMinus").onclick = () => {
  angle -= 0.35;
  update();
};

$("anglePlus").onclick = () => {
  angle += 0.35;
  update();
};

$("angleMinusBig").onclick = () => {
  angle -= 3.52;
  update();
};

$("anglePlusBig").onclick = () => {
  angle += 3.52;
  update();
};

$("reflectionMinus").onclick = () => {
  reflectionCount = Math.max(0, reflectionCount - 1);
  update();
};

$("reflectionPlus").onclick = () => {
  reflectionCount = Math.min(30, reflectionCount + 1);
  update();
};

$("addBlock").onclick = () => {
  pendingBlock = {
    x: 600,
    y: 1100
  };
  $("blockStatus").textContent = "ブロックをドラッグして位置を決めてください。";
  update();
};

$("fixBlock").onclick = () => {
  if (!pendingBlock) return;

  blocks.push({ ...pendingBlock });
  pendingBlock = null;

  $("blockStatus").textContent = "ブロックを固定しました。";
  update();
};

$("deleteBlock").onclick = () => {
  if (pendingBlock) {
    pendingBlock = null;
    $("blockStatus").textContent = "追加中のブロックを削除しました。";
  } else if (blocks.length) {
    blocks.pop();
    $("blockStatus").textContent = "最後のブロックを削除しました。";
  }

  update();
};

$("toggleWidth").onclick = function() {
  showWidth = !showWidth;
  this.classList.toggle("active", showWidth);
  this.textContent = `軌道幅 ${showWidth ? "ON" : "OFF"}`;
  update();
};

$("toggleWall").onclick = function() {
  showWall = !showWall;
  this.classList.toggle("active", showWall);
  this.textContent = `壁 ${showWall ? "ON" : "OFF"}`;
  update();
};

$("toggleExtension").onclick = function() {
  showExtension = !showExtension;
  this.classList.toggle("active", showExtension);
  this.textContent = `延長線 ${showExtension ? "ON" : "OFF"}`;
  update();
};

$("toggleRed").onclick = function() {
  showRed = !showRed;
  this.classList.toggle("active", showRed);
  this.textContent = `赤線 ${showRed ? "ON" : "OFF"}`;
  update();
};

$("toggleMarks").onclick = function() {
  showMarks = !showMarks;
  this.classList.toggle("active", showMarks);
  this.textContent = `反射点 ${showMarks ? "ON" : "OFF"}`;
  update();
};

$("lineColor").oninput = update;

$("reset").onclick = () => {
  launch = { x: 591, y: 700 };
  angle = 63.6328125;
  reflectionCount = 5;
  blocks = [];
  pendingBlock = null;
  update();
};

// SVG上のドラッグ操作
let dragging = null;

function getSvgPoint(e) {
  const rect = svg.getBoundingClientRect();

  return {
    x: (e.clientX - rect.left) * 1206 / rect.width,
    y: (e.clientY - rect.top) * 2622 / rect.height
  };
}

svg.addEventListener("pointerdown", e => {
  const p = getSvgPoint(e);

  if (mode === "launch") {
    if (Math.hypot(p.x - launch.x, p.y - launch.y) < 150) {
      dragging = "launch";
    }
  }

  if (mode === "block") {
    if (pendingBlock) {
      dragging = "pending";
    } else {
      const index = blocks.findIndex(b =>
        Math.hypot(p.x - b.x, p.y - b.y) < 90
      );

      if (index >= 0) {
        if (deleteMode) {
          blocks.splice(index, 1);
          update();
        } else {
          dragging = index;
        }
      }
    }
  }

  svg.setPointerCapture(e.pointerId);
});

svg.addEventListener("pointermove", e => {
  if (dragging === null) return;

  const p = getSvgPoint(e);

  if (dragging === "launch") {
    launch.x = p.x;
    launch.y = p.y;
  } else if (dragging === "pending" && pendingBlock) {
    pendingBlock.x = p.x;
    pendingBlock.y = p.y;
  } else if (typeof dragging === "number") {
    blocks[dragging].x = p.x;
    blocks[dragging].y = p.y;
  }

  update();
});

svg.addEventListener("pointerup", () => {
  dragging = null;
});

svg.addEventListener("pointercancel", () => {
  dragging = null;
});

update();
</script>
</body>
</html>
