<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<title>モンスト反射ガイド</title>
<script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>
<style>
*{box-sizing:border-box}
body{
 margin:0;background:#111c2c;color:white;
 font-family:Arial,sans-serif;
 overflow:hidden;
}
#app{
 height:100dvh;height:100svh;
 display:flex;flex-direction:column;
 padding:5px 7px calc(5px + env(safe-area-inset-bottom));
 gap:5px;
 max-width:500px;margin:auto;
}
header{text-align:center;font-weight:bold;font-size:15px}
#game{
 width:calc(100% - 2cm);
 max-width:344px;
 aspect-ratio:1206/2622;
 max-height:calc(100% - 190px);
 margin:auto;
 background:#101d30;
 border:2px solid #667b94;
 position:relative;
 flex-shrink:1;
 min-height:0;
}
svg{width:100%;height:100%;display:block;touch-action:none}
#screenshot{
 width:100%;height:32px;min-height:32px;
 border-radius:6px;border:1px solid #9aadc4;
 background:#263e59;color:white;font-weight:bold;
}
#tools{display:grid;grid-template-columns:repeat(3,1fr);gap:5px}
button{
 border:1px solid #637c98;border-radius:6px;
 background:#263e59;color:white;
 min-height:34px;padding:5px 3px;
 font-size:12px;font-weight:bold;
}
button.active{background:#20cbb0;color:#102c2b}
.panel{
 display:flex;flex-direction:column;gap:4px;
 min-height:0;
}
.row{display:flex;gap:5px}
.row>*{flex:1;min-width:0}
input[type=number]{width:100%;min-width:0;padding:5px}
input[type=range]{width:100%}
#toggles{
 display:flex;gap:4px;overflow-x:auto;
 padding-bottom:2px;
}
#toggles button{white-space:nowrap;flex-shrink:0}
#status{
 text-align:center;font-size:11px;
 color:#d5e4ef;padding:2px;
}
#blockPanel,#anglePanel{display:none}
#blockPanel.visible,#anglePanel.visible{display:flex}
#expanded{
 display:none;position:fixed;inset:0;z-index:20;
 background:#111c2c;
 padding:10px;
 padding-bottom:calc(60px + env(safe-area-inset-bottom));
 overflow:auto;
}
#expanded.visible{display:block}
#expandedContent{
 width:100%;max-width:500px;margin:auto;
}
#expandedContent #game{
 width:min(100%,380px);
 max-height:none;
 margin:10px auto;
}
#back{
 position:fixed;bottom:calc(10px + env(safe-area-inset-bottom));
 left:12px;z-index:22;
 width:85px;height:44px;
 display:none;background:#20cbb0;color:#102c2b;
}
#back.visible{display:block}
#shotPreview{
 display:none;position:fixed;inset:0;z-index:30;
 background:#101827;overflow:auto;
 padding:12px;
}
#shotPreview.visible{display:block}
#shotImage{width:100%;height:auto;display:block;margin:10px auto}
#shotPreview button{width:100%;margin-bottom:8px}
.small{font-size:10px;color:#bac8d8}
</style>
</head>
<body>

<div id="app">
<header>モンスト反射ガイド</header>

<button id="screenshot">▤　1画面スクショ・拡大表示</button>

<div id="game">
<svg id="svg" viewBox="0 0 1206 2622">
<path id="wall" d="M44 502H1162V1762H44Z"
 fill="none" stroke="#50d9d5" stroke-width="4"/>
<path id="widthLine" fill="none" stroke="white"
 stroke-opacity=".35" stroke-width="105"/>
<path id="path" fill="none" stroke="black" stroke-width="5"/>
<path id="extension" fill="none" stroke="black" stroke-width="5"/>
<path id="redLine" fill="none" stroke="red" stroke-width="5"/>
<g id="blocks"></g>
<g id="marks"></g>
<circle id="launch" r="89.7" fill="#00b9d5"
 stroke="#087e96" stroke-width="5"/>
<circle id="center" r="5" fill="white"/>
</svg>
</div>

<div id="status">発射点を設定してください</div>

<div id="tools">
<button id="pos" class="active">◎ 発射点</button>
<button id="ang">↗ 角度</button>
<button id="blk">□ ブロック</button>
</div>

<div id="anglePanel" class="panel">
<div class="row">
<button id="angMinus">−0.35°</button>
<input id="angle" type="number" value="63.63" step=".35">
<button id="angPlus">＋0.35°</button>
</div>
<input id="slider" type="range" min="0" max="359.65" step=".35" value="63.63">
</div>

<div id="blockPanel" class="panel">
<div class="row">
<button id="add">追加</button>
<button id="confirm" class="active">確定</button>
<button id="delete">削除</button>
</div>
<div class="small" id="blockInfo">仮ブロックを配置できます</div>
</div>

<div class="row">
<button id="minus">反射回数 −</button>
<button id="plus">反射回数 ＋</button>
</div>

<div id="toggles">
<button data-toggle="widthLine" class="active">幅 ON</button>
<button data-toggle="wall" class="active">壁線 ON</button>
<button data-toggle="marks" class="active">数字 ON</button>
<button data-toggle="yellow" class="active">黄色円 ON</button>
<button data-toggle="extension" class="active">延長線 ON</button>
<button data-toggle="redLine" class="active">赤線 ON</button>
</div>

<div class="row">
<button id="lineColor">線：黒</button>
<button id="reset">リセット</button>
</div>
</div>

<div id="expanded">
<div id="expandedContent"></div>
</div>
<button id="back">← 戻る</button>

<div id="shotPreview">
<button id="closeShot">← 戻る</button>
<div id="shotMessage" class="small">スクリーンショット</div>
<img id="shotImage" alt="ゲーム画面のスクリーンショット">
<button id="download">画像を保存</button>
</div>

<script>
(()=>{
const $=id=>document.getElementById(id);
const svg=$('svg');
const B={l:44,r:1162,t:502,b:1762};
const R=89.7,H=70,N=1024;

let x=591,y=700;
let angle=63.6328125*Math.PI/180;
let mode='pos',drag=false,limit=6;
let blocks=[],pending=null,nextId=1;
let white=false;
let toggles={
 widthLine:true,wall:true,marks:true,
 yellow:true,extension:true,redLine:true
};

const quant=a=>{
 return (Math.round((((a%(2*Math.PI))+2*Math.PI)%(2*Math.PI))/(2*Math.PI)*N)%N)*2*Math.PI/N;
};
const deg=a=>(a*180/Math.PI+360)%360;

function point(e){
 const r=svg.getBoundingClientRect();
 return {
  x:(e.clientX-r.left)/r.width*1206,
  y:(e.clientY-r.top)/r.height*2622
 };
}

function wallHit(px,py,dx,dy){
 let tx=dx>1e-10?(B.r-px)/dx:dx< -1e-10?(B.l-px)/dx:Infinity;
 let ty=dy>1e-10?(B.b-py)/dy:dy< -1e-10?(B.t-py)/dy:Infinity;
 let t=Math.min(tx,ty);
 if(!isFinite(t)||t<1e-7)return null;
 let corner=Math.abs(tx-ty)<1e-7;
 return {
  t,x:px+dx*t,y:py+dy*t,
  nx:corner?(dx>0?-1:1):tx<ty?(dx>0?-1:1):0,
  ny:corner?(dy>0?-1:1):tx<ty?0:(dy>0?-1:1)
 };
}

function blockHit(px,py,dx,dy,b){
 const l=b.x-H-R,r=b.x+H+R;
 const t=b.y-H-R,bt=b.y+H+R;
 let hits=[];
 function add(q,nx,ny,ok){
  if(q>1e-7&&ok)hits.push({t:q,nx,ny});
 }
 if(Math.abs(dx)>1e-10){
  for(const xx of [l,r]){
   let q=(xx-px)/dx,yy=py+dy*q;
   add(q,xx===l?-1:1,0,yy>=t&&yy<=bt);
  }
 }
 if(Math.abs(dy)>1e-10){
  for(const yy of [t,bt]){
   let q=(yy-py)/dy,xx=px+dx*q;
   add(q,0,yy===t?-1:1,xx>=l&&xx<=r);
  }
 }
 hits.sort((a,b)=>a.t-b.t);
 return hits[0]||null;
}

function trace(){
 let px=x,py=y,dx=Math.cos(angle),dy=Math.sin(angle);
 let d=`M${x} ${y}`,hits=[];
 for(let i=1;i<=limit;i++){
  let h=wallHit(px,py,dx,dy);
  for(const b of blocks){
   const z=blockHit(px,py,dx,dy,b);
   if(z&&(!h||z.t<h.t))h=z;
  }
  if(!h)break;
  h.x=px+dx*h.t;
  h.y=py+dy*h.t;
  h.n=i;
  d+=` L${h.x} ${h.y}`;
  hits.push({...h,dx,dy});
  const dot=dx*h.nx+dy*h.ny;
  dx-=2*dot*h.nx;
  dy-=2*dot*h.ny;
  px=h.x+dx*.02;
  py=h.y+dy*.02;
 }
 return {d,hits};
}

function draw(){
 const z=trace();
 $('path').setAttribute('d',z.d);
 $('path').setAttribute('stroke',white?'white':'black');
 $('widthLine').setAttribute('d',z.d);
 $('widthLine').style.display=toggles.widthLine?'':'none';
 $('wall').style.display=toggles.wall?'':'none';
 $('extension').style.display=toggles.extension?'':'none';
 $('redLine').style.display=toggles.redLine?'':'none';
 $('redLine').setAttribute('d',
  `M${x} ${y}L${x-Math.cos(angle)*1800} ${y-Math.sin(angle)*1800}`);
 $('launch').setAttribute('cx',x);
 $('launch').setAttribute('cy',y);
 $('center').setAttribute('cx',x);
 $('center').setAttribute('cy',y);

 const marks=$('marks');
 marks.replaceChildren();

 if(z.hits.length&&toggles.extension){
  const h=z.hits[0];
  const d=Math.hypot(h.dx,h.dy);
  const q=2000;
  $('extension').setAttribute('d',
   `M${h.x} ${h.y}L${h.x+h.dx*q} ${h.y+h.dy*q}`);
 }

 z.hits.forEach(h=>{
  if(toggles.yellow){
   const c=document.createElementNS('http://www.w3.org/2000/svg','circle');
   c.setAttribute('cx',h.x);
   c.setAttribute('cy',h.y);
   c.setAttribute('r',14);
   c.setAttribute('fill','#ffdf27');
   marks.append(c);
  }
  if(toggles.marks){
   const t=document.createElementNS('http://www.w3.org/2000/svg','text');
   t.setAttribute('x',h.x);
   t.setAttribute('y',h.y-18);
   t.setAttribute('font-size',36);
   t.setAttribute('fill','white');
   t.setAttribute('stroke','#333');
   t.setAttribute('stroke-width',3);
   t.setAttribute('paint-order','stroke');
   t.textContent=h.n;
   marks.append(t);
  }
 });

 $('blocks').replaceChildren();
 [...blocks,...(pending?[pending]:[])].forEach(b=>{
  const r=document.createElementNS('http://www.w3.org/2000/svg','rect');
  r.setAttribute('x',b.x-H);
  r.setAttribute('y',b.y-H);
  r.setAttribute('width',140);
  r.setAttribute('height',140);
  r.setAttribute('fill','#ff7777');
  r.setAttribute('fill-opacity','.5');
  r.setAttribute('stroke','#ed4444');
  r.setAttribute('stroke-width',7);
  if(!b.fixed)r.setAttribute('stroke-dasharray','9 6');
  $('blocks').append(r);
 });

 $('status').textContent=
  `発射点 (${Math.round(x)},${Math.round(y)})　角度 ${deg(angle).toFixed(2)}°　反射 ${z.hits.length}回`;
 $('blockInfo').textContent=pending?
  `仮ブロック ${pending.id}（未確定）`:
  `固定ブロック ${blocks.length}個`;
 $('angle').value=deg(angle).toFixed(2);
 $('slider').value=deg(angle);
}

function setMode(m){
 mode=m;
 ['pos','ang','blk'].forEach(id=>$(id).classList.toggle('active',id===m));
 $('anglePanel').classList.toggle('visible',m==='ang');
 $('blockPanel').classList.toggle('visible',m==='blk');
 if(m==='blk'&&!pending){
  pending={id:nextId++,x:375,y:1405,fixed:false};
 }
 draw();
}

$('pos').onclick=()=>setMode('pos');
$('ang').onclick=()=>setMode('ang');
$('blk').onclick=()=>setMode('blk');

svg.addEventListener('pointerdown',e=>{
 const p=point(e);
 if(mode==='blk'){
  if(!pending)return;
  drag=true;
  svg.setPointerCapture(e.pointerId);
  moveBlock(p);
  return;
 }
 if(mode==='pos'){
  x=p.x;y=p.y;
 }else{
  angle=quant(Math.atan2(p.y-y,p.x-x));
 }
 drag=true;
 svg.setPointerCapture(e.pointerId);
 draw();
});
function moveBlock(p){
 if(!pending)return;
 pending.x=Math.max(B.l+H,Math.min(B.r-H,p.x));
 pending.y=Math.max(B.t+H,Math.min(B.b-H,p.y));
 draw();
}
svg.addEventListener('pointermove',e=>{
 if(!drag)return;
 const p=point(e);
 if(mode==='pos'){
  x=Math.max(B.l,Math.min(B.r,p.x));
  y=Math.max(B.t,Math.min(B.b,p.y));
 }else if(mode==='ang'){
  angle=quant(Math.atan2(p.y-y,p.x-x));
 }else moveBlock(p);
 draw();
});
svg.addEventListener('pointerup',()=>drag=false);
svg.addEventListener('pointercancel',()=>drag=false);

$('angle').onchange=()=>{angle=quant(Number($('angle').value)*Math.PI/180);draw()};
$('slider').oninput=()=>{angle=quant(Number($('slider').value)*Math.PI/180);draw()};
$('angMinus').onclick=()=>{angle=quant(angle-.3515625*Math.PI/180);draw()};
$('angPlus').onclick=()=>{angle=quant(angle+.3515625*Math.PI/180);draw()};

$('minus').onclick=()=>{limit=Math.max(0,limit-1);draw()};
$('plus').onclick=()=>{limit=Math.min(50,limit+1);draw()};

$('add').onclick=()=>{
 if(pending)return;
 pending={id:nextId++,x:375,y:1405,fixed:false};
 draw();
};
$('confirm').onclick=()=>{
 if(!pending)return;
 pending.fixed=true;
 blocks.push(pending);
 pending=null;
 draw();
};
$('delete').onclick=()=>{
 if(pending){
  pending=null;
 }else if(blocks.length){
  blocks.pop();
 }
 draw();
};

document.querySelectorAll('[data-toggle]').forEach(b=>{
 b.onclick=()=>{
  const id=b.dataset.toggle;
  toggles[id]=!toggles[id];
  b.textContent=({
   widthLine:'幅',wall:'壁線',marks:'数字',
   yellow:'黄色円',extension:'延長線',redLine:'赤線'
  })[id]+' '+(toggles[id]?'ON':'OFF');
  b.classList.toggle('active',toggles[id]);
  draw();
 };
});

$('lineColor').onclick=()=>{
 white=!white;
 $('lineColor').textContent='線：'+(white?'白':'黒');
 draw();
};

$('reset').onclick=()=>{
 x=591;y=700;angle=rad(63.63);
 blocks=[];pending=null;limit=6;
 draw();
};

function rad(v){return v*Math.PI/180}

/* 画面拡大 */
const app=$('app'),expanded=$('expanded');
const expandedContent=$('expandedContent');
let expandedMode=false;

$('screenshot').onclick=()=>{
 expandedMode=true;
 expandedContent.appendChild(app);
 expanded.classList.add('visible');
 $('back').classList.add('visible');
 $('screenshot').textContent='▤ スクリーンショットを作成';
 $('screenshot').onclick=makeScreenshot;
};
$('back').onclick=()=>{
 if(!expandedMode)return;
 expandedMode=false;
 $('app').before(app);
 expanded.classList.remove('visible');
 $('back').classList.remove('visible');
 $('screenshot').textContent='▤ 1画面スクショ・拡大表示';
 $('screenshot').onclick=()=>{
  expandedMode=true;
  expandedContent.appendChild(app);
  expanded.classList.add('visible');
  $('back').classList.add('visible');
  $('screenshot').onclick=makeScreenshot;
 };
};

async function makeScreenshot(){
 if(!window.html2canvas){
  alert('スクリーンショット機能の読み込みに失敗しました。通信環境を確認してください。');
  return;
 }
 const canvas=await html2canvas(app,{
  backgroundColor:'#111c2c',
  scale:2,
  useCORS:true
 });
 $('shotImage').src=canvas.toDataURL('image/png');
 $('shotPreview').classList.add('visible');
}
$('closeShot').onclick=()=>$('shotPreview').classList.remove('visible');
$('download').onclick=()=>{
 const a=document.createElement('a');
 a.href=$('shotImage').src;
 a.download='monst-reflection-guide.png';
 a.click();
};

draw();
})();
</script>
</body>
</html>
